# One origin for the whole app: the React bundle, the API, the uploaded photos and
# Django's own static files all answer on the same host and port. That is what
# removes CORS from the container setup entirely — the browser never makes a
# cross-origin request, so there is no preflight and no allowlist to maintain.

upstream backend {
    # `backend` resolves via compose's internal DNS to the service of that name.
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    # Listing photos are phone-camera JPEGs and routinely exceed nginx's 1 MB
    # default, which rejects them with a 413 before Django ever sees the request.
    # The symptom is an upload that fails only for large images, which reads as a
    # flaky backend rather than a proxy limit.
    client_max_body_size 20m;

    # Inherited by every proxy_pass below. Host in particular matters: DRF builds
    # absolute image URLs with request.build_absolute_uri, so if nginx forwarded
    # its own upstream name the API would hand the browser links to
    # http://backend:8000/media/... — a hostname that only resolves inside the
    # compose network, and every listing photo would break.
    #
    # $http_host, NOT $host. They differ in exactly one way and it matters here:
    # $host is the hostname with the port STRIPPED, $http_host is the client's
    # Host header verbatim, port included. With $host, an upload posted to
    # localhost:8080 came back as "http://localhost/media/..." — port 80 — and
    # every photo 404s in the browser while the API looks perfectly healthy.
    # Caught by fetching an uploaded image back through the proxy; nothing in the
    # API response looks wrong until you follow the URL.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Uploaded photos, served straight off the shared volume. nginx does this far
    # better than Django would, and with DEBUG=False Django will not serve them at
    # all — config/urls.py only mounts the media route under DEBUG. Without this
    # block every listing image on the demo is a broken icon.
    # `root`, not `alias`: with root, /media/x.jpg maps to /var/www/media/x.jpg by
    # simple concatenation, and try_files behaves. try_files inside an alias
    # location is a long-standing nginx wart that resolves against the wrong path.
    location /media/ {
        root /var/www;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
        # A missing upload should look like a missing file, not fall through to
        # the SPA and return index.html with a 200.
        try_files $uri =404;
    }

    # Django's collected static files — the admin CSS, the DRF browsable API, and
    # the Swagger UI assets at /api/docs/. WhiteNoise serves these from inside the
    # backend container with its own cache headers, which pass through unchanged.
    location /static/ {
        proxy_pass http://backend;
    }

    # The API, the OpenAPI schema and the Swagger page all live under /api/.
    location /api/ {
        proxy_pass http://backend;
        # Extraction can sit on a slow vision call; don't cut it off before
        # gunicorn's own 120s timeout has a chance to apply.
        proxy_read_timeout 120s;
    }

    location /admin/ {
        proxy_pass http://backend;
    }

    location / {
        root /usr/share/nginx/html;

        # React Router owns the client-side routes. A hard refresh on /listings/7
        # asks nginx for a file that does not exist; without this fallback it 404s
        # and the app appears to break on reload but not on navigation.
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints these filenames, so a changed file is a changed URL and a
    # long cache is safe.
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html is the one file whose name never changes. Caching it would pin
    # browsers to the previous build's asset references after a rebuild.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }
}
